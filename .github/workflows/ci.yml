name: CI
on:
  push:
    branches: [main, feat/privacy-rate-limits-deployment, feat/private-membership-roles-coins]
  pull_request:
    branches: [main, feat/privacy-rate-limits-deployment]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

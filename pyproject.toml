[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "menfessbot"
version = "0.1.0"
description = "Telegram menfess bot with moderated channel publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot==21.10",
  "python-dotenv==1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
